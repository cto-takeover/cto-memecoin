<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTO mockup: Phone: wow moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=JetBrains+Mono:wght@500;700&amp;family=Luckiest+Guy&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF6E0;color:#111111;font-family:'Space Grotesk',system-ui,sans-serif}
a{color:#111111}a:hover{color:#D7141A}
.hd{font-family:'Archivo Black',Impact,sans-serif;letter-spacing:-.01em;line-height:1.02;margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.card{background:#FFFFFF;border:3px solid #111111;box-shadow:4px 4px 0 #111111;padding:18px}
.kick{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;background:#D7141A;color:#FFF6E0;border:3px solid #111111;box-shadow:4px 4px 0 #111111;font-family:'Archivo Black',sans-serif;font-size:20px;text-decoration:none;letter-spacing:.02em;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{color:#FFF6E0;transform:translate(2px,2px);box-shadow:2px 2px 0 #111111}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #111111}
.btn:disabled{opacity:.6;cursor:wait}
.ghost{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;background:#FFFFFF;border:3px solid #111111;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;text-decoration:none;color:#111111;cursor:pointer;box-shadow:3px 3px 0 #111111}
.ghost:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #111111}
.stamp{display:inline-block;font-family:'Luckiest Guy',cursive;font-size:28px;letter-spacing:.04em;padding:6px 14px 2px;border:4px solid currentColor;transform:rotate(-8deg);background:#FFF6E0;line-height:1.1}
.sticker{display:inline-block;background:#FFD60A;border:3px solid #111111;box-shadow:3px 3px 0 #111111;padding:8px 14px;transform:rotate(-3deg)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid #111111;background:#FFFFFF;padding:4px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;text-decoration:none;color:#111111}
.ok{background:#00EC97}
.muted{color:#5C5346}
.rcpt{background:#FFFFFF;border-left:3px solid #111111;border-right:3px solid #111111;padding:14px 18px;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;font-size:15px;position:relative}
.rcpt:before,.rcpt:after{content:'';position:absolute;left:-3px;right:-3px;height:3px;background:repeating-linear-gradient(90deg,#111111 0 10px,transparent 10px 16px)}
.rcpt:before{top:0}.rcpt:after{bottom:0}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:24px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px}
.navp{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:2px solid #111111;font-weight:700;text-decoration:none;font-size:14px;background:#FFFFFF}
.navp.on{background:#111111;color:#FFF6E0}
.sw{display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:2px solid #111111;padding:4px;min-height:44px;cursor:pointer;transition:transform .1s}
.sw:hover{transform:translateY(-3px) rotate(-2deg)}
.sw.sel{border:4px solid #111111;box-shadow:3px 3px 0 #111111;background:#FFD60A}
.tab{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:3px solid #111111;font-family:'Archivo Black',sans-serif;font-size:14px;background:#FFFFFF;color:#111111;cursor:pointer}
.tab.on{background:#111111;color:#FFF6E0}
.halftone{background-image:radial-gradient(#E9D9B0 1.4px,transparent 1.6px);background-size:12px 12px}
.ticker{overflow:hidden;background:#111111;color:#FFF6E0;border-bottom:3px solid #111111}
.ticker-track{display:inline-flex;gap:56px;white-space:nowrap;padding:8px 0;animation:ticker 32s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#00EC97;margin-right:6px;animation:livedot 1.2s ease-in-out infinite}
.a-bob{animation:bob 4.5s ease-in-out infinite}
.a-thunk{animation:thunk .45s cubic-bezier(.2,1.6,.4,1) both}
.a-wiggle{animation:wiggle 4s ease-in-out infinite}
.a-flame{display:inline-block;animation:flicker .6s ease-in-out infinite;transform-origin:50% 90%}
.a-rise{animation:rise .5s ease-out both}
.a-out{animation:outL .5s ease-in forwards}
.a-drop{animation:drop .6s cubic-bezier(.3,1.4,.5,1) both}
.a-shake{animation:shake .45s ease-in-out both}
.a-shuffle{animation:shuffle .18s linear infinite}
.a-toast{animation:toast .4s cubic-bezier(.2,1.4,.4,1) both}
.a-pulse{animation:pulse 1.6s ease-in-out infinite}
.a-fill{animation:fill 1s ease-out both}
.a-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}
.cursor{display:inline-block;width:9px;height:1.1em;background:currentColor;vertical-align:-3px;animation:blink 1s steps(1) infinite}
.struck{position:relative}
.struck:after{content:'';position:absolute;left:0;top:52%;height:3px;background:#D7141A;animation:strike .5s ease-out forwards;width:0}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes livedot{50%{opacity:.25}}
@keyframes bob{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(-.5deg) translateY(-8px)}}
@keyframes thunk{0%{transform:rotate(-8deg) scale(2);opacity:0}60%{transform:rotate(-8deg) scale(.9);opacity:1}100%{transform:rotate(-8deg) scale(1);opacity:1}}
@keyframes wiggle{0%,82%,100%{transform:rotate(0)}85%{transform:rotate(-3deg)}88%{transform:rotate(3deg)}91%{transform:rotate(-2deg)}94%{transform:rotate(1deg)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes outL{to{transform:translateX(-160%) rotate(-14deg);opacity:0}}
@keyframes drop{0%{transform:translateY(-140%) rotate(6deg);opacity:0}70%{transform:translateY(5%) scaleY(.94);opacity:1}100%{transform:none;opacity:1}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
@keyframes shuffle{0%{transform:rotate(-3deg) translateX(-5px)}50%{transform:rotate(3deg) translateX(5px)}100%{transform:rotate(-3deg) translateX(-5px)}}
@keyframes toast{from{transform:translateY(30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@keyframes strike{to{width:100%}}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}.ticker-track{animation:none !important}}
</style>
</head>
<body>

</div>

</html>
