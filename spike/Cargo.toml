[package]
name = "cto-spike"
description = "Throwaway gate test for CTO (spec 0): contract swaps its own function-call key; live token icon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
repository = "https://github.com/cto-takeover/cto-memecoin"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-sandbox = "0.4.0"
near-api = "0.8"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
